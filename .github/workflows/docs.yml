# Publishes docs/ to GitHub Pages.
#
# VitePress builds the Markdown that is already in the repository — no second copy of the
# documentation, and the pages stay plain Markdown, with the navigation living in
# docs/.vitepress/config.ts rather than in front matter at the top of every file.
#
# Requires Pages to be set to "GitHub Actions" in the repository settings; the workflow
# cannot turn that on for you.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'yarn.lock'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a queued one waits rather than replacing what is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `lastUpdated` reads the git history of each page; a shallow clone dates them all
          # to the one commit it fetched.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: corepack enable
      - run: yarn install --immutable

      - run: yarn docs:build

      # These two move together with configure-pages: they agree on an artifact format, so
      # bumping one alone is how Pages jobs break.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
