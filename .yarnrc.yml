# Yarn 4 (Berry). Линкер — node-modules, а не PnP по умолчанию.
# Причина конкретная: проект исполняется через tsx, а tsx резолвит модули
# собственным esbuild-лоадером и не умеет читать Plug'n'Play-карту.
# С PnP команды `yarn agent` / `yarn client` сломались бы на импортах @a2a-js/sdk.
nodeLinker: node-modules

# Кэш держим вне репозитория (глобальный), иначе .yarn/cache разрастётся
# и утащит за собой все зависимости в git.
enableGlobalCache: true
